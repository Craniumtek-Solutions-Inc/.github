name: Bug report
description: Report a reproducible defect in a repository that accepts public issues.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for security vulnerabilities. Follow SECURITY.md instead.
  - type: input
    id: repository
    attributes:
      label: Repository or product
      description: Which Craniumtek repository or product is affected?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest safe reproduction. Remove secrets and private data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser/app version, runtime, device, or other relevant context.
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Logs, screenshots, or traces with sensitive information removed.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report does not contain credentials, personal data, or a security vulnerability.
          required: true
